name: CI

on:
    pull_request:
        branches:
            - main
            - develop

jobs:
    lint-and-test:
        runs-on: ubuntu-latest
        steps:
            - name: 🏗 Setup repo
              uses: actions/checkout@v4

            - name: 🟢 Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '18.x'
                  cache: 'npm'

            - name: 📦 Install Dependencies
              run: npm ci

            - name: 🕵️ Linting
              run: npx expo lint

            # - name: 🧪 Run Tests
            #   run: npm run test

            # - name: 📊 Code Coverage
            #   run: npm run test:coverage

            # - name: 🛡️ Dependency Audit
            #   run: npm audit
